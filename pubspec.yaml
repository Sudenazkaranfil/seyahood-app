name: seyahood_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  lottie: ^3.0.0
  cupertino_icons: ^1.0.8
  http_parser: ^4.0.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  path_provider: ^2.1.2
  sticker_widget: any
  share_plus: ^10.0.0
  screenshot: ^3.0.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  url_launcher: ^6.2.0
  google_mobile_ads: ^6.0.0
  exif_reader: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# sticker_widget'ın büyütme/küçültme hassasiyetini düşürmek için
# projeye vendor edildi (packages/sticker_widget) — paketin kendisi
# bu adımı dışarıdan ayarlamaya izin vermiyor.
dependency_overrides:
  sticker_widget:
    path: packages/sticker_widget

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png